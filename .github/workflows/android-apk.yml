name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-studio/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    name: APK offline instalable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-studio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JUANCITO-offline.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JUANCITO-offline-apk
          path: android-studio/app/build/outputs/apk/debug/JUANCITO-offline.apk
          if-no-files-found: error
          retention-days: 30
